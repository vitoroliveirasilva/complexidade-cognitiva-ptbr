[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complexidade-cognitiva-ptbr"
version = "0.1.0"
description = "Pipeline local para estimação automática de complexidade cognitiva em textos literários em português."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vitor Oliveira Silva" }
]
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.4,<2.0",
  "nltk>=3.8,<4.0",
  "matplotlib>=3.8,<4.0",
  "PyYAML>=6.0,<7.0",
  "joblib>=1.3,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

