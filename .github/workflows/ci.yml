name: Qualidade do pipeline TCC

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint, testes e smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint com Ruff
        run: ruff check .

      - name: Testes com cobertura
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pytest \
            --cov=complexidade_cognitiva_ptbr \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Smoke test do pipeline sem dataset oficial
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          rm -rf outputs/ci_smoke
          python scripts/run_pipeline.py --config configs/ci_smoke_config.yaml
          python scripts/validate_artifacts.py --config configs/ci_smoke_config.yaml --profile smoke
          python scripts/predict_text.py \
            --config configs/ci_smoke_config.yaml \
            --text "Texto literário de exemplo para classificação."
